<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Equipamentos</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --texto: #1f2933; --suave: #616e7c;
    --borda: #d9e2ec; --primaria: #2563eb; --primaria-hover: #1d4ed8;
    --perigo: #dc2626; --ok-bg: #dcfce7; --ok-tx: #166534;
    --man-bg: #fef3c7; --man-tx: #92400e; --par-bg: #fee2e2; --par-tx: #991b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --card: #1e293b; --texto: #e2e8f0; --suave: #94a3b8;
      --borda: #334155; --primaria: #3b82f6; --primaria-hover: #60a5fa;
      --perigo: #f87171; --ok-bg: #14532d; --ok-tx: #bbf7d0;
      --man-bg: #78350f; --man-tx: #fde68a; --par-bg: #7f1d1d; --par-tx: #fecaca;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--texto); }
  a { color: var(--primaria); }
  nav { display: flex; gap: 4px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--borda); }
  nav a { padding: 6px 12px; border-radius: 6px; text-decoration: none; color: var(--texto); }
  nav a.ativo { background: var(--primaria); color: #fff; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--suave); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .card h2 { margin: 0 0 16px; font-size: 1.1rem; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--suave); }
  input, select { padding: 9px 10px; border: 1px solid var(--borda); border-radius: 6px; font-size: .95rem;
                  background: var(--bg); color: var(--texto); }
  button { padding: 9px 14px; border: 0; border-radius: 6px; font-size: .95rem; cursor: pointer; }
  .btn-primario { background: var(--primaria); color: #fff; }
  .btn-primario:hover { background: var(--primaria-hover); }
  .btn-sec { background: transparent; border: 1px solid var(--borda); color: var(--texto); }
  .btn-perigo { background: transparent; color: var(--perigo); }
  .acoes-form { display: flex; gap: 8px; }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .barra h2 { margin: 0; }
  .tabela-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--borda); white-space: nowrap; }
  th { font-size: .8rem; text-transform: uppercase; color: var(--suave); }
  td.acoes { text-align: right; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .operando { background: var(--ok-bg); color: var(--ok-tx); }
  .manutencao { background: var(--man-bg); color: var(--man-tx); }
  .parado { background: var(--par-bg); color: var(--par-tx); }
  .vazio { text-align: center; color: var(--suave); padding: 28px; }
  #aviso { position: fixed; bottom: 20px; right: 20px; max-width: 360px; padding: 12px 16px; border-radius: 8px;
           color: #fff; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  #aviso.sucesso { background: #16a34a; display: block; }
  #aviso.erro { background: #dc2626; display: block; }
</style>
</head>
<body>
<nav>
  <a href="/" class="ativo">Cadastro</a>
  <a href="/simulador">Simulador da API</a>
  <a href="/docs">Docs técnicas</a>
</nav>
<main>
  <h1>Cadastro de Equipamentos</h1>
  <p class="sub">Tela de uso: cadastre, edite e exclua equipamentos. Para ver as requisições por baixo, abra o <a href="/simulador">Simulador da API</a>.</p>

  <!-- Formulário: serve tanto para CADASTRAR quanto para EDITAR -->
  <section class="card">
    <h2 id="titulo-form">Novo equipamento</h2>
    <form id="form">
      <label>Tag <input name="tag" required minlength="2" maxlength="30" placeholder="BR-2001-01"></label>
      <label>Nome <input name="nome" required minlength="2" maxlength="100" placeholder="Britador cônico primário"></label>
      <label>Tipo <input name="tipo" required minlength="2" maxlength="50" placeholder="britador"></label>
      <label>Status
        <select name="status">
          <option value="operando">Operando</option>
          <option value="manutencao">Em manutenção</option>
          <option value="parado">Parado</option>
        </select>
      </label>
      <div class="acoes-form">
        <button type="submit" class="btn-primario" id="btn-salvar">Cadastrar</button>
        <button type="button" class="btn-sec" id="btn-cancelar" hidden>Cancelar</button>
      </div>
    </form>
  </section>

  <!-- Lista -->
  <section class="card">
    <div class="barra">
      <h2>Equipamentos</h2>
      <label>Filtrar por status
        <select id="filtro">
          <option value="">Todos</option>
          <option value="operando">Operando</option>
          <option value="manutencao">Em manutenção</option>
          <option value="parado">Parado</option>
        </select>
      </label>
    </div>
    <div class="tabela-wrap">
      <table>
        <thead><tr><th>ID</th><th>Tag</th><th>Nome</th><th>Tipo</th><th>Status</th><th></th></tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="aviso"></div>

<script>
const API = "/equipamentos";
const ROTULOS = { operando: "Operando", manutencao: "Em manutenção", parado: "Parado" };

const form = document.getElementById("form");
const linhas = document.getElementById("linhas");
const filtro = document.getElementById("filtro");
let editandoId = null;      // null = modo cadastro; número = editando esse id
let cache = [];             // última lista carregada

// Evita que um texto digitado vire HTML na página (proteção contra XSS)
const esc = (t) => String(t).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function avisar(msg, tipo = "sucesso") {
  const el = document.getElementById("aviso");
  el.textContent = msg;
  el.className = tipo;
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => (el.className = ""), 3500);
}

// Faz a requisição e transforma erros da API em mensagens legíveis
async function chamar(url, opcoes = {}) {
  const resp = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opcoes });
  if (resp.status === 204) return null;
  const corpo = await resp.json();
  if (!resp.ok) {
    const d = corpo.detail;
    throw new Error(Array.isArray(d) ? d.map((e) => `${e.loc.at(-1)}: ${e.msg}`).join("; ") : d);
  }
  return corpo;
}

// READ
async function carregar() {
  const url = filtro.value ? `${API}?status=${filtro.value}&limit=100` : `${API}?limit=100`;
  cache = await chamar(url);
  if (cache.length === 0) {
    linhas.innerHTML = `<tr><td colspan="6" class="vazio">Nenhum equipamento cadastrado.</td></tr>`;
    return;
  }
  linhas.innerHTML = cache.map((e) => `
    <tr>
      <td>${e.id}</td>
      <td><strong>${esc(e.tag)}</strong></td>
      <td>${esc(e.nome)}</td>
      <td>${esc(e.tipo)}</td>
      <td><span class="badge ${e.status}">${ROTULOS[e.status]}</span></td>
      <td class="acoes">
        <button class="btn-sec" onclick="editar(${e.id})">Editar</button>
        <button class="btn-perigo" onclick="remover(${e.id})">Excluir</button>
      </td>
    </tr>`).join("");
}

// CREATE e UPDATE (o mesmo formulário)
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const dados = Object.fromEntries(new FormData(form));
  try {
    if (editandoId) {
      await chamar(`${API}/${editandoId}`, { method: "PATCH", body: JSON.stringify(dados) });
      avisar("Equipamento atualizado.");
    } else {
      await chamar(API, { method: "POST", body: JSON.stringify(dados) });
      avisar("Equipamento cadastrado.");
    }
    sairDaEdicao();
    await carregar();
  } catch (erro) {
    avisar(erro.message, "erro");
  }
});

function editar(id) {
  const e = cache.find((x) => x.id === id);
  editandoId = id;
  for (const campo of ["tag", "nome", "tipo", "status"]) form.elements[campo].value = e[campo];
  document.getElementById("titulo-form").textContent = `Editando equipamento #${id}`;
  document.getElementById("btn-salvar").textContent = "Salvar alterações";
  document.getElementById("btn-cancelar").hidden = false;
  form.scrollIntoView({ behavior: "smooth" });
}

function sairDaEdicao() {
  editandoId = null;
  form.reset();
  document.getElementById("titulo-form").textContent = "Novo equipamento";
  document.getElementById("btn-salvar").textContent = "Cadastrar";
  document.getElementById("btn-cancelar").hidden = true;
}

// DELETE
async function remover(id) {
  const e = cache.find((x) => x.id === id);
  if (!confirm(`Excluir o equipamento ${e.tag}?`)) return;
  try {
    await chamar(`${API}/${id}`, { method: "DELETE" });
    if (editandoId === id) sairDaEdicao();
    avisar("Equipamento excluído.");
    await carregar();
  } catch (erro) {
    avisar(erro.message, "erro");
  }
}

document.getElementById("btn-cancelar").addEventListener("click", sairDaEdicao);
filtro.addEventListener("change", carregar);
carregar().catch((erro) => avisar("Não foi possível conectar à API: " + erro.message, "erro"));
</script>
</body>
</html>
